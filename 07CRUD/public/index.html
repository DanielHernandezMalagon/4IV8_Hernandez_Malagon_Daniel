<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejemplo de CRUD</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./css/styles.css">
</head>
<body>

    <div class="bg-decorations">
        <div class="glow-1"></div>
        <div class="glow-2"></div>
        <div class="grid-pattern"></div>
    </div>

    <div class="container-main">
        
        <div class="container-back">
            <a href="../../index.html" class="btn-back">
                <span class="arrow">←</span> Volver al Inicio
            </a>
        </div>

        <div class="portfolio-wrapper">
            <header>
                <h1>Ejemplo de Gestión de Usuarios</h1>
            </header>
            
            <main>
                <section class="formulario-section">  
                    <h2 id="form-titulo">Agregar Nuevo Usuario</h2>
                    <form id="form-usuario">
                        <input type="hidden" id="id-usuario">
                        
                        <div class="campo">
                            <label for="nombre">Nombre Completo</label>
                            <input type="text" id="nombre" placeholder="Aquí va tu nombre" maxlength="60" required>
                            <span id="error-nombre" class="error"></span>
                        </div>

                        <div class="campo">
                            <label for="fecha_nacimiento">Fecha de Nacimiento</label>
                            <input type="date" id="fecha_nacimiento" required>
                            <span id="error-fecha" class="error"></span>
                        </div>

                        <div class="campo">
                            <label for="nota">Nota (0-10)</label>
                            <input type="number" id="nota" placeholder="Por ejemplo 8.5" min="0" max="10" step="0.1" required>
                            <span id="error-nota" class="error"></span>
                        </div>

                        <div class="container-buttons">
                            <button type="submit" id="btn-guardar">Guardar</button>
                            <button type="button" id="btn-cancelar" class="btn-secundario" style="display: none;">Cancelar</button>
                        </div>
                    </form>    
                </section>

                <section class="table-section">
                    <h2>Lista de Usuarios</h2>
                    <p id="mensaje-carga">Cargando Usuarios...</p>
                    <p id="mensaje-vacio" style="display: none;">No hay Usuarios Registrados</p>
                    
                    <div class="responsive-table-container">
                        <table id="tabla-usuarios" style="display: none;">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Nombre</th>
                                    <th>Fecha de Nacimiento</th>
                                    <th>Nota</th>
                                    <th>Acciones</th>
                                </tr>
                            </thead>
                            <tbody id="tbody-usuarios">
                                </tbody>
                        </table>
                    </div>
                </section>
            </main>
        </div>
    </div>
    
</body>
</html>
