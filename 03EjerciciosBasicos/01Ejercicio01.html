<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./css/style.css">
    <title>Primer ejercicio de los 10</title>
</head>
<body>

    <div class="bg-decorations">
        <div class="glow-1"></div>
        <div class="glow-2"></div>
        <div class="grid-pattern"></div>
    </div>

    <div class="container-main">

        <div class="container-back">
            <a href="../index.html" class="btn-back">
                <span class="arrow">←</span> Volver al Inicio
            </a>
        </div>

        <div class="portfolio-wrapper">
            <div class="Ejercicio01">
                <form method="post" id="formularioejer1" name="formularioejer1" action="">
                    <label for="">
                        Formulario para calcular una inversión x% de interés anual
                    </label>
                    <div class="container-table">
                        <table class="table">
                            <tr>
                                <td>
                                    Introduce la cantidad que deseas invertir todo un año
                                </td>
                                <td>
                                    <input type="text" name="cantidad" id="cantidadi" onkeypress="return validarn(event)">
                                </td>
                            </tr>
                            <tr>
                                <td></td>
                                <td>
                                    <input type="button" value="Calcular Interes" name="enviar" onclick="interes()">
                                </td>
                            </tr>
                            <tr>
                                <td>
                                    Su saldo es de:
                                </td>
                                <td>
                                    <input type="text" name="sueldoi" id="sueldoi" readonly="readonly">
                                </td>
                            </tr>
                            <tr>
                                <td></td>
                                <td>
                                    <input type="button" value="Borrar Datos" name="delete" onclick="borrar()">
                                </td>
                            </tr>
                        </table>
                    </div>
                </form>
            </div>
        </div>

    </div>

    <script src="./JS/interes.js"></script>
</body>
